name: Deploy to Namecheap cPanel

on:
  push:
    branches:
      - main # Change to master if your default branch is master
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
      
      - name: ⚙️ Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          
      - name: 🔨 Build Project
        run: |
          npm install
          npm run build
          
          # Copy the PHP API folder into the dist folder so it gets uploaded along with the frontend
          cp -r api dist/api
          
      - name: 📂 Sync files to cPanel via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21098
          local_path: './dist/*'
          remote_path: '/public_html'
          sftp_only: true
